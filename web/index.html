<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">

  <div class="main">
    <header class="topbar">

        <kbd>Ctrl K</kbd>
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
